<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Раскатка адресов</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="ico.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <!-- Экран загрузки и подключения БД -->
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
        <p id="loader-status">Загрузка приложения...</p>
        <!-- Контейнер для вывода логов -->
        <div id="console-logs" class="logs-container"></div>
    </div>

    <!-- Диалог обновления -->
    <div id="version-overlay" class="hidden">
        <div class="version-dialog">
            <h2>🆕 Новая версия доступна</h2>
            <p>Версия <strong id="new-version-text"></strong> доступна на сервере.<br>Текущая версия: <strong id="local-version-text"></strong></p>
            <div class="version-buttons">
                <button id="btn-update" onclick="doUpdate()">Обновить</button>
                <button id="btn-skip" onclick="skipUpdate()">Пропустить</button>
            </div>
        </div>
    </div>

    <header>
        <nav id="menu">
            <ul>
                <li class="me active" onclick="switchTab('raskatka-tool')" id="tab-raskatka">Раскатка</li>
                <li class="me" onclick="switchTab('sbor-tool')" id="tab-sbor">Сбор дополнений</li>
                <li class="me" onclick="switchTab('search-tool')" id="tab-search">Дополнение таблицы</li>
            </ul>
        </nav>
    </header>

    <main id="main-content">
        <section id="search-tool" class="tab-section hidden-element">
            <h1>Дополнение таблицы</h1>
            <form onsubmit="return false;">
                <div class="output-wrapper">
                    <div class="output">
                        <label for="search_cities">Список городов:</label>
                        <textarea id="search_cities" class="textarea-tall" placeholder="Москва&#10;Сочи&#10;..."></textarea>
                    </div>
                    <div class="output">
                        <label for="search_regions">Список регионов (Если есть):</label>
                        <textarea id="search_regions" class="textarea-tall" placeholder="Московская область&#10;Краснодарский край&#10;..."></textarea>
                    </div>
                </div>

                <div class="search-options"><label for="search_search_type">Тип поиска:</label></div>
                <div class="output-wrapper">
                    <div class="output">
                        <select id="search_search_type" onchange="toggleCustomSearchInputSearch()">
                            <option value="standard">Стандартный (Поиск города региона)</option>
                            <option value="custom">Пользовательский (Поиск ... в городе регионе)</option>
                        </select>
                    </div>
                    <div class="output">
                        <input type="text" id="search_custom_query" class="hidden-element" placeholder="Введите что искать в городе">
                    </div>
                </div>
            </form>
    
            <form onsubmit="return false;">
                <div class="output-wrapper">
                    <div class="output-bottom">
                        <label>Редактирование найденных данных:</label>
                        <div class="editor-grid">
                            <div>
                                <label class="editor-label">Город:</label>
                                <input type="text" id="search_out_city" class="editor-input">
                            </div>
                            <div>
                                <label class="editor-label">Регион:</label>
                                <input type="text" id="search_out_region" class="editor-input">
                            </div>
                            <div>
                                <label class="editor-label">Транслит:</label>
                                <input type="text" id="search_out_translit" class="editor-input">
                            </div>
                            <div>
                                <label class="editor-label">Тип НП:</label>
                                <input type="text" id="search_out_type" class="editor-input">
                            </div>
                            <div>
                                <label class="editor-label">Адрес (нормализованный):</label>
                                <input type="text" id="search_out_address" class="editor-input">
                            </div>
                            <div>
                                <label class="editor-label">Комментарий:</label>
                                <input type="text" id="search_out_comm" placeholder="(не обязательный блок)" class="editor-input">
                            </div>
                            <div class="col-span-2">
                                <label class="editor-label">Полный адрес (из карточки):</label>
                                <input type="text" id="search_out_full_address" class="editor-input">
                            </div>
                            <div>
                                <label class="editor-label">Координаты:</label>
                                <input type="text" id="search_out_coords" class="editor-input">
                            </div>
                            <div>
                                <label class="editor-label">Индекс:</label>
                                <input type="text" id="search_out_index" class="editor-input">
                            </div>
                        </div>
                    </div>

                    <div class="output">
                        <label for="search_skipped_cities">Пропущенные:</label>
                        <textarea id="search_skipped_cities" readonly class="textarea-skipped"></textarea>
                    </div>
                </div>

                <div class="button-wrapper">
                    <div class="side-buttons">
                        <button type="button" id="search_btn_main_action" onclick="handleSearchCycle()">Начать</button>
                        <button type="button" id="search_btn_capture" onclick="captureCurrentData()" disabled>Записать</button>
                        <button type="button" id="search_btn_save" onclick="saveDataToTable()" disabled>Сохранить</button>
                    </div>
                </div>
            </form>
        </section>

        <section id="sbor-tool" class="tab-section hidden-element">
            <h1>Сбор дополнений</h1>
            <form onsubmit="return false;">
                <div class="output-wrapper">
                    <div class="output">
                        <label for="sbor_adresses">Адрес:</label>
                        <textarea id="sbor_adresses" class="textarea-tall sync-scroll" placeholder="ул. Староволынская, 10&#10;ул. Декабристов, 71&#10;..."></textarea>
                    </div>
                    <div class="output">
                        <label for="sbor_cities">Город:</label>
                        <textarea id="sbor_cities" class="textarea-tall sync-scroll" placeholder="Москва&#10;Сочи&#10;..."></textarea>
                    </div>
                    <div class="output">
                        <label for="sbor_regions">Регион:</label>
                        <textarea id="sbor_regions" class="textarea-tall sync-scroll" placeholder="Московская область&#10;Краснодарский край&#10;..."></textarea>
                    </div>
                    <div class="output">
                        <label for="sbor_errors">Ошибки/Не найденные:</label>
                        <textarea id="sbor_errors" readonly class="textarea-skipped"></textarea>
                    </div>
                </div>
            </form>

            <form onsubmit="return false;">
                <div class="output-wrapper">
                    <div class="output">
                        <label for="sbor_translit">Транслит:</label>
                        <textarea id="sbor_translit" class="textarea-tall sync-scroll"></textarea>
                    </div>
                    <div class="output">
                        <label for="sbor_coords">Координаты:</label>
                        <textarea id="sbor_coords" class="textarea-tall sync-scroll" ></textarea>
                    </div>
                    <div class="output">
                        <label for="sbor_out_regions">Регион:</label>
                        <textarea id="sbor_out_regions" class="textarea-tall sync-scroll"></textarea>
                    </div>
                    <div class="output">
                        <label for="sbor_index">Индекс:</label>
                        <textarea id="sbor_index" class="textarea-tall sync-scroll"></textarea>
                    </div>
                </div>

                <div class="button-wrapper">
                    <div class="side-buttons">
                        <button type="button" id="sbor_btn_start" onclick="btnSborStart()">Начать</button>
                    </div>
                </div>
            </form>
        </section>

        <section id="raskatka-tool" class="tab-section active">
            <h1>Раскатка</h1>
            <form onsubmit="return false;">
                <div class="output-wrapper">
                    <div class="output">
                        <label for="raskatka_cities">Город:</label>
                        <textarea id="raskatka_cities" class="textarea-tall sync-scroll" placeholder="Москва&#10;Сочи&#10;..."></textarea>
                    </div>
                    <div class="output">
                        <label for="raskatka_regions">Регион:</label>
                        <textarea id="raskatka_regions" class="textarea-tall sync-scroll" placeholder="Московская область&#10;Краснодарский край&#10;..."></textarea>
                    </div>
                    <div class="output">
                        <label for="raskatka_comm">Комментарий:</label>
                        <textarea id="raskatka_comm" class="textarea-tall sync-scroll" placeholder="метро&#10; &#10;..."></textarea>
                    </div>
                    <div class="output">
                        <label for="raskatka_errors">Ошибки/Не найденные:</label>
                        <textarea id="raskatka_errors" readonly class="textarea-skipped"></textarea>
                    </div>
                </div>

                <div class="search-options"><label for="raskatka_search_type">Выбор базы:</label></div>
                <div class="output-wrapper">
                    <div class="output">
                        <select id="raskatka_search_type" >
                            <option value="parser and rolling">Общая и начальная</option>
                            <option value="parser">Общая</option>
                            <option value="rolling">Начальная</option>
                        </select>
                    </div>
                </div>
            </form>

            <form onsubmit="return false;">
                <div class="output-wrapper">
                    <div class="output" style="flex: 1; min-width: 0;">
                        <label>Результаты раскатки:</label>
                        <div class="table-container">
                            <table id="raskatka-results-table" class="results-table">
                                <colgroup>
                                    <col class="col-main">
                                    <col class="col-main">
                                    <col class="col-main">
                                    <col class="col-coords">
                                    <col class="col-index">
                                </colgroup>
                                <thead>
                                    <tr>
                                        <th>Адрес</th>
                                        <th>Транслит</th>
                                        <th>Регион</th>
                                        <th>Координаты</th>
                                        <th>Индекс</th>
                                    </tr>
                                </thead>
                                <tbody id="raskatka-results-body"></tbody>
                                <tfoot>
                                    <tr>
                                        <td><button type="button" class="copy-col-btn" data-col="0" title="Копировать адреса">Адрес</button></td>
                                        <td><button type="button" class="copy-col-btn" data-col="1" title="Копировать транслит">Транслит</button></td>
                                        <td><button type="button" class="copy-col-btn" data-col="2" title="Копировать регион">Регион</button></td>
                                        <td><button type="button" class="copy-col-btn" data-col="3" title="Копировать координаты">Координаты</button></td>
                                        <td><button type="button" class="copy-col-btn" data-col="4" title="Копировать индекс">Индекс</button></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="button-wrapper">
                    <div class="side-buttons">
                        <button type="button" id="raskatka_btn_start" onclick="btnRaskatkaStart()">Начать</button>
                        <button type="button" id="raskatka_copy_all" onclick="copyAllRaskatkaTable()">Скопировать всю таблицу</button>
                    </div>
                    <div id="status_box">Ожидание действий пользователя</div>
                </div>
            </form>
        </section>
    </main>

    <script src="/eel.js"></script>
    <script src="script.js?v=3"></script>
</body>
</html>
